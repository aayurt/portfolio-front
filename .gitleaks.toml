# Gitleaks config: default rules + a targeted rule for embedded DB
# credentials (see portfolio-admin history for why this exists).
# Historical hits are baselined in .gitleaksignore — never add NEW
# fingerprints there; fix the leak instead.

[extend]
useDefault = true

[[rules]]
id = "postgres-credentials-in-code"
description = "Postgres connection URI with embedded password committed to source"
regex = '''(?i)postgres(ql)?://[^/\s:'"]+:[^/\s@'"]+@'''
tags = ["database", "credentials"]
