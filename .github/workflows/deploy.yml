# Deploy portfolio-front to PersonalVPS.
#
# Build runs on the GitHub runner (ubuntu, linux-x64 — native sharp binaries
# are already correct, no darwin re-bootstrap needed), then rsyncs the
# standalone bundle to the VPS and restarts pm2.
#
# Required GitHub secrets (repo Settings → Secrets → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY
#   NEXT_PUBLIC_API, NEXT_PUBLIC_SLUG, NEXT_PUBLIC_DOMAIN_LIST
#   PAGE_ACCESS_PASSWORD (runtime; never committed)
#
# Trigger: push to main or manual dispatch.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-front
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API: ${{ secrets.NEXT_PUBLIC_API }}
      NEXT_PUBLIC_SLUG: ${{ secrets.NEXT_PUBLIC_SLUG }}
      NEXT_PUBLIC_DOMAIN_LIST: ${{ secrets.NEXT_PUBLIC_DOMAIN_LIST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (standalone)
        run: |
          set -euo pipefail
          # Prod defaults when secrets are unset (mirrors deploy-standalone.sh).
          export NEXT_PUBLIC_API="${NEXT_PUBLIC_API:-https://aayurtshrestha.com.np/admin}"
          export NEXT_PUBLIC_SLUG="${NEXT_PUBLIC_SLUG:-aayurt}"
          export NEXT_PUBLIC_DOMAIN_LIST="${NEXT_PUBLIC_DOMAIN_LIST:-[{\"domain\": \"rujamaharjan.com.np\", \"slug\": \"ruja\"}, {\"domain\": \"aayushshrestha.com\", \"slug\": \"aayush\"}]}"
          pnpm build

      - name: Assemble standalone bundle
        run: |
          set -euo pipefail
          STANDALONE=".next/standalone"
          [ -d public ] && cp -r public "$STANDALONE/"
          [ -d .next/static ] && cp -r .next/static "$STANDALONE/.next/"
          cp ecosystem.config.cjs package.json "$STANDALONE/"

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          printf 'Host vps-deploy\n\tHostName %s\n\tUser %s\n\tIdentityFile ~/.ssh/deploy_key\n\tStrictHostKeyChecking yes\n' \
            "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_USER }}" > ~/.ssh/config

      - name: Rsync bundle to VPS
        run: |
          set -euo pipefail
          rsync -avz --delete \
            .next/standalone/ \
            vps-deploy:/var/www/portfolio/.next/standalone/

      - name: Write server .env + restart pm2
        env:
          NEXT_PUBLIC_API: ${{ secrets.NEXT_PUBLIC_API }}
          NEXT_PUBLIC_SLUG: ${{ secrets.NEXT_PUBLIC_SLUG }}
          NEXT_PUBLIC_DOMAIN_LIST: ${{ secrets.NEXT_PUBLIC_DOMAIN_LIST }}
          PAGE_ACCESS_PASSWORD: ${{ secrets.PAGE_ACCESS_PASSWORD }}
        run: |
          set -euo pipefail
          # NEXT_PUBLIC_* are baked at build time; the server .env carries
          # runtime values. Empty secrets never wipe the server: each var
          # falls back to the on-server value, then to the prod default
          # (mirrors scripts/deploy-standalone.sh).
          pick() {
            # $1=secret value, $2=server key, $3=default
            if [ -n "${1:-}" ]; then echo "$1"; return; fi
            kept="$(ssh vps-deploy "grep -E '^$2=' /var/www/portfolio/.env 2>/dev/null || true" | head -1 | cut -d= -f2- || true)"
            if [ -n "$kept" ]; then echo "$kept"; return; fi
            echo "$3"
          }
          if [ -z "${PAGE_ACCESS_PASSWORD:-}" ]; then
            PAGE_ACCESS_PASSWORD="$(ssh vps-deploy "grep -E '^PAGE_ACCESS_PASSWORD=' /var/www/portfolio/.env 2>/dev/null || true" | head -1 | cut -d= -f2- || true)"
            export PAGE_ACCESS_PASSWORD
          fi
          {
            echo "NEXT_PUBLIC_API=$(pick "${NEXT_PUBLIC_API:-}" NEXT_PUBLIC_API "https://aayurtshrestha.com.np/admin")"
            echo "NEXT_PUBLIC_SLUG=$(pick "${NEXT_PUBLIC_SLUG:-}" NEXT_PUBLIC_SLUG "aayurt")"
            echo "NEXT_PUBLIC_DOMAIN_LIST=$(pick "${NEXT_PUBLIC_DOMAIN_LIST:-}" NEXT_PUBLIC_DOMAIN_LIST '[{"domain": "rujamaharjan.com.np", "slug": "ruja"}, {"domain": "aayushshrestha.com", "slug": "aayush"}]')"
            echo "VISITS_DIR=/var/www/portfolio/data"
            if [ -n "${PAGE_ACCESS_PASSWORD:-}" ]; then
              echo "PAGE_ACCESS_PASSWORD=${PAGE_ACCESS_PASSWORD}"
            fi
          } | ssh vps-deploy "cat > /var/www/portfolio/.env"
          ssh vps-deploy "cp /var/www/portfolio/.next/standalone/ecosystem.config.cjs /var/www/portfolio/ && source ~/.nvm/nvm.sh && cd /var/www/portfolio && (pm2 delete portfolio 2>/dev/null || true) && pm2 start ecosystem.config.cjs && pm2 save"

      - name: Verify
        run: |
          ssh vps-deploy "curl -sk -o /dev/null -w 'front:%{http_code}\n' --max-time 25 https://aayurtshrestha.com.np/"
